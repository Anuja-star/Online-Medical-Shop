# ===============================
# SERVER CONFIG
# ===============================
server.port=9091

# ===============================
# DATABASE CONFIG (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/medishop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=@Anuja1111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# FILE UPLOAD (IMAGES)
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# STATIC RESOURCE (IMAGE ACCESS)
# ===============================
# This tells Spring to look in the internal classpath AND the external "uploads" folder
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
# This ensures that the resource handler mapping is enabled
spring.mvc.static-path-pattern=/**